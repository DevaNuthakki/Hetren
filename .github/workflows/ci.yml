name: Hetren Foundation CI

on:
  push:
    branches:
      - main
      - 'mvp/**'
      - 'portfolio/**'
      - 'milestone-*/**'
    # Release tags only (docs/milestone-4/PLAN.md, step 8): vX.Y.Z and vX.Y.Z-rc.N. Milestone tags (milestone-N)
    # start no workflow, and only these tags reach the publish job.
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetren-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast job: every push. Repository checks and every test not marked slow.
  repository:
    name: Repository foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # Fixed location for tiktoken's vocabulary file, restored from the cache
      # so CI does not download it on every run.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache tiktoken vocabulary
        uses: actions/cache@v6
        with:
          path: .cache/tiktoken
          key: tiktoken-0.14.0-o200k_base

      - name: Install CI Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check -r requirements-dev.txt

          python -c "from importlib.metadata import version; assert version('jsonschema') == '4.26.0'; assert version('pytest') == '7.4.4'; assert version('pytest-xdist') == '3.8.0'; assert version('openai') == '3.42.0'; assert version('openai-agents') == '0.24.0'; assert version('tiktoken') == '0.14.0'; [print(name, version(name)) for name in ('jsonschema', 'pytest', 'pytest-xdist', 'openai', 'openai-agents', 'tiktoken')]"

      - name: Verify required repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          required=(
            apps/control_plane
            apps/runner
            apps/studio
            packages/core
            packages/contracts
            packages/engines/behavioral
            packages/engines/internal
            environments/agent
            environments/tabular
            environments/vision
            research/native_intelligence
            research/adaptive_intelligence
            docs/research/native_intelligence
            docs/research/adaptive_intelligence
            tests/qualification
            docs/mvp
          )

          for path in "${required[@]}"; do
            test -d "$path" || {
              echo "Missing required repository boundary: $path"
              exit 1
            }
          done

      - name: Reject active legacy architecture
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            backend
            frontend
            hvee
          )

          for path in "${forbidden[@]}"; do
            if test -e "$path"; then
              echo "Legacy architecture path is active: $path"
              exit 1
            fi
          done

      - name: Verify secrets are not tracked
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked"
            exit 1
          fi

      - name: Verify MVP authority records
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/mvp/00-authority.md
          test -f docs/mvp/02-charter.md
          test -f docs/mvp/02-charter-qualification.md
          test -f docs/decisions/0001-reset-active-repository.md
          test -f docs/decisions/0002-decision-governance.md
          test -f docs/decisions/register.md
          test -f docs/decisions/template.md
          test -f docs/decisions/qualification/0002-decision-governance.md
          test -f docs/mvp/03-success-contracts.md
          test -f docs/decisions/0003-success-contracts.md
          test -f docs/decisions/qualification/0003-success-contracts.md
          test -f docs/architecture/repository-layout.md
          test -f scripts/check_mvp_charter.py
          test -f scripts/check_decision_register.py
          test -f scripts/check_success_contracts.py
          test -f tests/qualification/test_mvp_charter.py
          test -f tests/qualification/test_decision_register.py
          test -f tests/qualification/test_success_contracts.py
          test -f docs/mvp/04-system-taxonomy.md
          test -f docs/decisions/0004-system-taxonomy.md
          test -f docs/decisions/qualification/0004-system-taxonomy.md
          test -f scripts/check_system_taxonomy.py
          test -f tests/qualification/test_system_taxonomy.py
          test -f docs/mvp/05-support-matrix.md
          test -f docs/decisions/0005-mvp-support-matrix.md
          test -f docs/decisions/qualification/0005-mvp-support-matrix.md
          test -f scripts/check_support_matrix.py
          test -f tests/qualification/test_support_matrix.py
          test -f tests/qualification/test_research_hypotheses_register_compatibility.py
          test -f docs/mvp/07-initial-splits.md
          test -f docs/decisions/0008-initial-split-protocol.md
          test -f docs/decisions/qualification/0008-initial-split-protocol.md
          test -f scripts/check_initial_splits.py
          test -f scripts/check_initial_splits_data.py
          test -f scripts/check_initial_splits_qualification_data.py
          test -f tests/qualification/test_initial_splits.py
          test -f tests/qualification/test_initial_splits_fingerprint_portability.py
          test -f tests/qualification/test_initial_splits_data.py
          test -f tests/qualification/test_initial_splits_positive.py
          test -f tests/qualification/test_initial_splits_holdout.py
          test -f tests/qualification/test_initial_splits_holdout_b.py
          test -f tests/qualification/test_initial_splits_holdout_c.py
          test -f tests/qualification/test_initial_splits_holdout_d.py
          test -f tests/qualification/test_initial_splits_qualification_data.py
          test -f tests/qualification/test_initial_splits_set_e_remediation.py
          test -f tests/qualification/data/initial_splits/qualification_cases.json
          test -f tests/qualification/data/initial_splits/qualification_cases.schema.json
          test -f docs/decisions/qualification/evidence/0008-set-e-first-run-evidence.sha256
          test -f docs/decisions/qualification/evidence/0008-set-e-remediation-2-regression-evidence.sha256

      - name: Qualify MVP charter
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_mvp_charter.py --require-qualified
          python3 tests/qualification/test_mvp_charter.py

      - name: Qualify decision governance
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_decision_register.py
          python3 tests/qualification/test_decision_register.py

      - name: Qualify success contracts
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_success_contracts.py --require-qualified
          python3 tests/qualification/test_success_contracts.py

      - name: Qualify system taxonomy
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_system_taxonomy.py --require-qualified
          python3 tests/qualification/test_system_taxonomy.py

      - name: Qualify MVP support matrix
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_support_matrix.py --require-qualified
          python3 tests/qualification/test_support_matrix.py

      - name: Qualify research hypotheses
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_research_hypotheses.py --require-qualified
          python3 tests/qualification/test_research_hypotheses.py
          python3 tests/qualification/test_research_hypotheses_register_compatibility.py

      - name: Qualify initial split protocol
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_initial_splits.py --require-qualified

          python3 scripts/check_initial_splits_data.py
          python3 tests/qualification/test_initial_splits_data.py

          python3 scripts/check_initial_splits_qualification_data.py
          python3 tests/qualification/test_initial_splits_qualification_data.py

          python3 tests/qualification/test_initial_splits.py
          python3 tests/qualification/test_initial_splits_fingerprint_portability.py
          python3 tests/qualification/test_initial_splits_positive.py

          python3 tests/qualification/test_initial_splits_holdout.py
          python3 tests/qualification/test_initial_splits_holdout_b.py
          python3 tests/qualification/test_initial_splits_holdout_c.py
          python3 tests/qualification/test_initial_splits_holdout_d.py

          python3 tests/qualification/test_initial_splits_set_e_remediation.py

          sha256sum -c docs/decisions/qualification/evidence/0008-set-e-first-run-evidence.sha256

          sha256sum -c docs/decisions/qualification/evidence/0008-set-e-remediation-2-regression-evidence.sha256

          # The frozen Milestone 2 evaluation protocol (changes only as dated amendments, re-pinned in the same commit).
          sha256sum -c docs/milestone-2/EVAL_PROTOCOL.sha256


      - name: Verify every test runs in the fast or slow job
        shell: bash
        run: |
          set -euo pipefail

          count() { python -m pytest --collect-only -q "$@" | grep -c '::' || true; }

          all=$(count)
          fast=$(count -m 'not slow')
          slow=$(count -m slow)
          echo "tests: all $all, fast $fast, slow $slow"

          test "$slow" -gt 0
          test $((fast + slow)) -eq "$all"

      - name: Run modern portfolio tests (fast)
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q -m 'not slow' -n auto --dist loadfile

      - name: Verify deterministic portfolio demonstration
        shell: bash
        run: |
          set -euo pipefail

          python -m packages.portfolio_demo

          python -m packages.portfolio_demo --format json > /tmp/hetren-demo-1.json
          python -m packages.portfolio_demo --format json > /tmp/hetren-demo-2.json

          cmp -s /tmp/hetren-demo-1.json /tmp/hetren-demo-2.json

          python -c "import json; from pathlib import Path; report=json.loads(Path('/tmp/hetren-demo-1.json').read_text(encoding='utf-8')); expected='e93f258ca3428f8c262d529ae24f2cc8370f72a7e8073ebea5833a9cafc97ffe'; assert report['report_sha256'] == expected; print('portfolio demo report_sha256', report['report_sha256'])"

  # Slow job: dataset regeneration and full case labelling. Pull requests,
  # pushes to main and manual runs only.
  slow:
    name: Slow tests (dataset and labelling)
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The tier 2 (dataset v3) build test labels a tiny dataset; about 12 minutes locally.
    timeout-minutes: 30

    env:
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache tiktoken vocabulary
        uses: actions/cache@v6
        with:
          path: .cache/tiktoken
          key: tiktoken-0.14.0-o200k_base

      - name: Install CI Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Install CPU torch and accelerate (QLoRA gradient accumulation test)
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.11.0+cpu'
          python -m pip install --disable-pip-version-check 'accelerate==1.10.1'
          python -c "import torch, accelerate; print('torch', torch.__version__, 'accelerate', accelerate.__version__)"

      - name: Run slow tests
        shell: bash
        run: |
          set -euo pipefail

          python -m pytest -q -m slow -n auto --dist loadfile

  # Docker job: every push, read-only. Builds the hetren-cli image and checks its properties (no model in CI;
  # inference is the operator's Linux check).
  docker:
    name: Docker image (hetren-cli)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hetren-cli/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: |
            HETREN_COMMIT=${{ github.sha }}
          load: true
          push: false
          tags: hetren-cli:ci
          cache-from: type=gha,scope=hetren-cli
          cache-to: type=gha,scope=hetren-cli,mode=max

      - name: Check the image
        shell: bash
        run: |
          set -euo pipefail

          docker/hetren-cli/check-image.sh hetren-cli:ci

  # Deploy checks: every push, read-only, no credentials. The Helm chart (lint, template, schemas, design
  # properties) and the Terraform code (fmt, validate, tflint). Nothing is planned or applied.
  deploy:
    name: Deploy checks (Helm, Terraform)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the pinned tools
        shell: bash
        run: |
          set -euo pipefail

          deploy/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check the Helm chart
        shell: bash
        run: |
          set -euo pipefail

          deploy/helm/check-chart.sh

      - name: Check the Terraform code
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # tflint downloads its Google ruleset from GitHub
        run: |
          set -euo pipefail

          deploy/terraform/check.sh

  # Report job: every push, read-only. Builds docs/TECHNICAL_REPORT.md into a PDF (pandoc and Typst, image pinned by
  # digest, no network in the container) and keeps it with its sha256 as a workflow artifact. On a release tag the
  # operator attaches that artifact to the GitHub release (docs/milestone-4/PLAN.md, step 8.8), so CI never needs
  # write access.
  report:
    name: Technical report (PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build the PDF
        shell: bash
        run: |
          set -euo pipefail

          scripts/build_report_pdf.sh "$RUNNER_TEMP/report"

      - name: Keep the PDF and its sha256
        uses: actions/upload-artifact@v4
        with:
          name: technical-report
          path: ${{ runner.temp }}/report/
          if-no-files-found: error
          retention-days: 30

  # kind job: every push, read-only. Installs the same Helm chart GKE uses on a kind cluster, with this commit's
  # image and the stub llama-server, and checks the plumbing (not inference). The /diagnose and k6 part runs
  # once the repository variable HETREN_MODEL_REPO names the published model repository (step 7a).
  kind:
    name: kind (Helm chart, stub model)
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read

    env:
      HETREN_MODEL_REPO: ${{ vars.HETREN_MODEL_REPO }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image (from the docker job's cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hetren-cli/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: |
            HETREN_COMMIT=${{ github.sha }}
          load: true
          push: false
          tags: hetren-cli:ci
          cache-from: type=gha,scope=hetren-cli

      - name: Build the stub llama-server image
        shell: bash
        run: |
          set -euo pipefail

          docker build -q deploy/kind/stub-llama-server -t hetren-stub-llama-server:ci

      - name: Install the pinned tools
        shell: bash
        run: |
          set -euo pipefail

          deploy/tools.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install the chart on kind and check it
        shell: bash
        run: |
          set -euo pipefail

          deploy/kind/smoke.sh

  # Publish job: release tags only (vX.Y.Z, vX.Y.Z-rc.N), after the docker job passed. Re-checks the tag and the
  # versions first, rebuilds from the docker job's cache, checks that build the same way, and pushes exactly the
  # image it checked to GitHub Container Registry.
  publish:
    name: Publish image (release tags)
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check the release tag and the versions
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_release_tag.py "$GITHUB_REF_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the runtime image (from the cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/hetren-cli/Dockerfile
          target: runtime
          platforms: linux/amd64
          build-args: |
            HETREN_COMMIT=${{ github.sha }}
          load: true
          push: false
          tags: hetren-cli:release
          cache-from: type=gha,scope=hetren-cli

      - name: Check the image
        shell: bash
        run: |
          set -euo pipefail

          docker/hetren-cli/check-image.sh hetren-cli:release

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the checked image
        shell: bash
        run: |
          set -euo pipefail

          target="ghcr.io/devanuthakki/hetren-cli:${GITHUB_REF_NAME}"
          docker tag hetren-cli:release "$target"
          docker push "$target"
