name: Hetren CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetren-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      HETREN_ENV: test
      HETREN_AUTH_SECRET_KEY: hetren-ci-auth-secret-test-only-2026-not-production
      DATABASE_URL: postgresql+psycopg://ovrin:ovrin_ci_only@127.0.0.1:5432/ovrin
      TEST_DATABASE_URL: postgresql+psycopg://ovrin:ovrin_ci_only@127.0.0.1:5432/ovrin_test
      DATABASE_ECHO: "false"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ovrin
          POSTGRES_USER: ovrin
          POSTGRES_PASSWORD: ovrin_ci_only
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ovrin -d ovrin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create isolated PostgreSQL test database
        run: |
          python - <<'PY'
          import psycopg
          from psycopg import sql

          connection_url = (
              "postgresql://ovrin:ovrin_ci_only"
              "@127.0.0.1:5432/postgres"
          )

          with psycopg.connect(
              connection_url,
              autocommit=True,
          ) as connection:
              database_exists = connection.execute(
                  """
                  SELECT 1
                  FROM pg_database
                  WHERE datname = %s
                  """,
                  ("ovrin_test",),
              ).fetchone()

              if database_exists is None:
                  connection.execute(
                      sql.SQL(
                          "CREATE DATABASE {} OWNER {}"
                      ).format(
                          sql.Identifier("ovrin_test"),
                          sql.Identifier("ovrin"),
                      )
                  )
          PY

      - name: Compile backend source
        run: |
          python -m compileall app scripts tests alembic

      - name: Migrate development database
        run: |
          python -m alembic upgrade head

      - name: Migrate test database
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" \
            python -m alembic upgrade head

      - name: Validate development migration state
        run: |
          python -m alembic current
          python -m alembic check

      - name: Validate test migration state
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" \
            python -m alembic current

          DATABASE_URL="$TEST_DATABASE_URL" \
            python -m alembic check

      - name: Run fast backend suite
        run: |
          python -m pytest -q -W error

      - name: Run complete PostgreSQL backend suite
        run: |
          RUN_POSTGRES_TESTS=1 \
            python -m pytest -q -W error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
