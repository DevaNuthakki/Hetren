name: Hetren Foundation CI

on:
  push:
    branches:
      - main
      - 'mvp/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetren-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          required=(
            apps/control_plane
            apps/runner
            apps/studio
            packages/core
            packages/contracts
            packages/engines/behavioral
            packages/engines/internal
            environments/agent
            environments/tabular
            environments/vision
            research/native_intelligence
            research/adaptive_intelligence
            docs/research/native_intelligence
            docs/research/adaptive_intelligence
            tests/qualification
            docs/mvp
          )

          for path in "${required[@]}"; do
            test -d "$path" || {
              echo "Missing required repository boundary: $path"
              exit 1
            }
          done

      - name: Reject active legacy architecture
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            backend
            frontend
            hvee
          )

          for path in "${forbidden[@]}"; do
            if test -e "$path"; then
              echo "Legacy architecture path is active: $path"
              exit 1
            fi
          done

      - name: Verify secrets are not tracked
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked"
            exit 1
          fi

      - name: Verify MVP authority records
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/mvp/00-authority.md
          test -f docs/mvp/02-charter.md
          test -f docs/mvp/02-charter-qualification.md
          test -f docs/decisions/0001-reset-active-repository.md
          test -f docs/decisions/0002-decision-governance.md
          test -f docs/decisions/register.md
          test -f docs/decisions/template.md
          test -f docs/decisions/qualification/0002-decision-governance.md
          test -f docs/architecture/repository-layout.md
          test -f scripts/check_mvp_charter.py
          test -f scripts/check_decision_register.py
          test -f tests/qualification/test_mvp_charter.py
          test -f tests/qualification/test_decision_register.py

      - name: Qualify MVP charter
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_mvp_charter.py --require-qualified
          python3 tests/qualification/test_mvp_charter.py

      - name: Qualify decision governance
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/check_decision_register.py
          python3 tests/qualification/test_decision_register.py
