# GKE (step 6b): the published image and the GGUF from the Hugging Face model repository.
#   helm install hetren deploy/helm/hetren -f deploy/gke/values.yaml \
#     --set image.tag=v1.0.0 --set model.repo=<huggingface repository>
# The Free Trial design (8 concurrent vCPUs in all): one pod per e2-standard-4 node (CPU request 2.5 of about 3.9
# allocatable, leaving room for GKE's system pods), llama-server on its 2 cores, 1 to 2 replicas on 1 to 2 nodes.
model:
  variant: Q4_K_M
threads: 2
maxQueue: 8
resources:
  requests:
    cpu: 2500m
    memory: 6Gi
    ephemeral-storage: 4Gi
  limits:
    memory: 7Gi
    ephemeral-storage: 8Gi
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60
nodeSelector:
  hetren/pool: inference
