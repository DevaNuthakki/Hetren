# ClusterIP only: no load balancer, no node port. The load test runs inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hetren.fullname" . }}
  labels:
    {{- include "hetren.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hetren.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
